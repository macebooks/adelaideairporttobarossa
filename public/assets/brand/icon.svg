<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="adelaideairporttobarossa.com.au mark: a runway light, a dotted road rising into a grape cluster">
  <!-- departure: runway light on the tarmac -->
  <circle cx="8" cy="54" r="4" fill="#E8A33D"/>
  <!-- the journey: dotted road rising toward the vines -->
  <path d="M16 55 C 27 55.5 34.5 50 40 43" fill="none" stroke="#241E1B" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.1 9.5"/>
  <!-- the road becomes a vine stem -->
  <path d="M41.5 41 C 44 37 45 34.5 45.4 31.5" fill="none" stroke="#2F5233" stroke-width="4" stroke-linecap="round"/>
  <!-- arrival: the grape cluster -->
  <circle cx="39.5" cy="22.5" r="6.8" fill="#7A2C3B"/>
  <circle cx="52" cy="22.5" r="6.8" fill="#7A2C3B"/>
  <circle cx="45.5" cy="31.5" r="6.8" fill="#7A2C3B"/>
  <!-- tendril -->
  <path d="M46.5 14 c 4 -3.8 9 -2.8 9 -2.8" fill="none" stroke="#2F5233" stroke-width="4" stroke-linecap="round"/>
</svg>
